name: CI

# Builds and tests both apps on every push and pull request. The release
# workflow reuses this file, so a release is only published from code that passes.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

env:
  VERSION: ${{ inputs.version || '0.0.0-dev' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: ./build.sh dist

      - name: Install Claude Code (for the live check)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Self-test
        run: |
          CE_SELF_TEST="$PWD/selftest-macos.txt" "dist/Claude Video Editor.app/Contents/MacOS/ClaudeVideoEditor" &
          pid=$!
          ( sleep 300; kill $pid 2>/dev/null ) & watchdog=$!
          wait $pid; status=$?
          kill $watchdog 2>/dev/null || true
          cat selftest-macos.txt || echo "no report written"
          exit $status

      - name: Screenshots
        run: |
          mkdir -p screenshots-macos
          APP="dist/Claude Video Editor.app/Contents/MacOS/ClaudeVideoEditor"
          for step in 0 1 2 3; do
            CE_ONBOARD_STEP=$step CE_SNAPSHOT="$PWD/screenshots-macos/onboarding-$step.png" CE_SNAPSHOT_DELAY=6 "$APP" &
            sleep 10; kill $! 2>/dev/null || true
          done
          defaults write io.github.itzghozt.claude-video-editor onboardingDone -bool true
          CE_OPEN_PROMPT=1 CE_SNAPSHOT="$PWD/screenshots-macos/editor.png" CE_SNAPSHOT_DELAY=6 "$APP" &
          sleep 10; kill $! 2>/dev/null || true
          ls screenshots-macos

      - name: Zip
        run: ditto -c -k --keepParent "dist/Claude Video Editor.app" "Claude-Video-Editor-macOS-$VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: Claude-Video-Editor-macOS-*.zip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-macos
          path: |
            selftest-macos.txt
            screenshots-macos/
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version
        shell: pwsh
        run: '"VERSION=$($env:VERSION.TrimStart(''v''))" >> $env:GITHUB_ENV'

      - name: Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish windows/ClaudeVideoEditor/ClaudeVideoEditor.csproj -c Release -r ${{ matrix.rid }} `
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -o out

      # The rest runs the app, which only works on the runner's own CPU (x64).
      - name: Install Claude Code (for the live check)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: irm https://claude.ai/install.ps1 | iex

      - name: Self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process out\ClaudeVideoEditor.exe -ArgumentList '--self-test', "$PWD\selftest-windows.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'self-test timed out' }
          Get-Content selftest-windows.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Screenshots
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process out\ClaudeVideoEditor.exe -ArgumentList '--snapshot', "$PWD\screenshots-windows" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'snapshot timed out' }
          Get-ChildItem screenshots-windows

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out\ClaudeVideoEditor.exe "dist\Claude Video Editor.exe"
          Copy-Item LICENSE, CREDITS.md dist\
          Compress-Archive dist\* "Claude-Video-Editor-Windows-${{ matrix.rid }}-$env:VERSION.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-${{ matrix.rid }}
          path: Claude-Video-Editor-Windows-*.zip

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'win-x64' && always()
        with:
          name: checks-windows
          path: |
            selftest-windows.txt
            screenshots-windows/
          if-no-files-found: ignore
