name: Windows build

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish windows/ClaudeVideoEditor/ClaudeVideoEditor.csproj -c Release -r ${{ matrix.rid }} `
            --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      # The rest runs the app itself, which only works on the runner's own CPU (x64).
      - name: Install Claude Code (for the live check)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: irm https://claude.ai/install.ps1 | iex

      - name: Self-test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process out\ClaudeVideoEditor.exe -ArgumentList '--self-test', "$PWD\selftest.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'self-test timed out' }
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Screenshots
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process out\ClaudeVideoEditor.exe -ArgumentList '--snapshot', "$PWD\screenshots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'snapshot timed out' }
          Get-ChildItem screenshots

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out\ClaudeVideoEditor.exe "dist\Claude Video Editor.exe"
          Copy-Item LICENSE, CREDITS.md dist\
          Compress-Archive dist\* "Claude-Video-Editor-Windows-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Video-Editor-Windows-${{ matrix.rid }}
          path: Claude-Video-Editor-Windows-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'win-x64' && always()
        with:
          name: checks
          path: |
            selftest.txt
            screenshots/
          if-no-files-found: ignore
